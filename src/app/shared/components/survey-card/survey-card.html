<a class="survey-card" [class.highlight]="highlight()" [class.past]="past()" [routerLink]="['/survey', poll().id]">
  <div class="card-top">
    <span class="category">{{ poll().category }}</span>
    @if (past()) { <span class="past-label">Past survey</span> }
  </div>
  <h3>{{ poll().title }}</h3>
  <span class="deadline">{{ daysLabel() }}</span>
</a>
