<div class="filter">
  <span>Sort by categories</span>
  <span class="chevron">⌄</span>
  <select [value]="selected()" (change)="changed.emit(value($event))" aria-label="Filter by category">
    @for (category of categories(); track category) { <option [value]="category">{{ category }}</option> }
  </select>
</div>
